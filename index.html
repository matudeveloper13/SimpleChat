<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-bar">
    <div class="user-info">
      <div id="top-left-profile" class="profile-preview hidden">
        <img 
          id="my-mini-avatar" 
          src="avatar1.png" 
          alt="User Avatar" 
          class="mini-avatar" 
        />
        <span id="my-mini-username">Guest</span>
      </div>
      <span id="current-user-text" class="hidden">Guest</span>
    </div>

    <div class="header-actions">
      <button id="open-friends-btn" class="btn btn-secondary">
        Friends
      </button>
      <button id="auth-modal-btn" class="btn btn-primary">
        Sign In / Register
      </button>
      <button id="logout-btn" class="btn btn-danger hidden">
        Logout
      </button>
    </div>
  </header>

  <!-- Main Application Container -->
  <main class="chat-container">
    
    <!-- Messages Scroll Area -->
    <div id="messages-container" class="messages-list"></div>

    <!-- Live Typing Indicator -->
    <div id="typing-indicator" class="typing-indicator hidden">
      <span id="typing-text">Someone is typing...</span>
    </div>

    <!-- Global Chat Form Input -->
    <form id="message-form" class="message-form">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Sign in to chat..." 
          autocomplete="off"
          disabled 
        />
        <button 
          type="button" 
          id="emoji-btn" 
          class="emoji-btn" 
          disabled
        >
          😊
        </button>
        
        <!-- Custom Emoji Picker Popup Window -->
        <div id="discord-emoji-picker" class="emoji-picker hidden">
          <div id="discord-emoji-grid" class="emoji-grid"></div>
        </div>
      </div>

      <button 
        type="submit" 
        id="send-btn" 
        class="btn btn-primary" 
        disabled
      >
        Send
      </button>
    </form>

  </main>

  <!-- Login / Registration Overlay Modal -->
  <div id="auth-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      
      <div class="tab-headers">
        <button id="tab-login" class="tab-btn active">
          Login
        </button>
        <button id="tab-register" class="tab-btn">
          Register
        </button>
      </div>

      <p id="auth-error" class="error-msg"></p>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input 
            type="text" 
            id="login-username" 
            placeholder="Enter username" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            placeholder="Enter password" 
            required 
          />
        </div>

        <button type="submit" class="btn btn-primary full-width">
          Login
        </button>
      </form>

      <!-- Registration Form -->
      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="register-username">Username</label>
          <input 
            type="text" 
            id="register-username" 
            placeholder="Choose username" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <input 
            type="password" 
            id="register-password" 
            placeholder="Choose password" 
            required 
          />
        </div>

        <button type="submit" class="btn btn-primary full-width">
          Register
        </button>
      </form>
    </div>
  </div>

  <!-- User Profile Edit Overlay -->
  <div id="profile-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-profile-modal" class="close-btn">&times;</button>
      <h2>My Profile Settings</h2>

      <div class="profile-header-edit">
        <img 
          id="edit-modal-avatar" 
          src="avatar1.png" 
          alt="Current Avatar" 
          class="large-avatar" 
        />
        <button id="open-avatar-selector" class="btn btn-secondary">
          Change Avatar
        </button>
      </div>

      <h3 id="profile-display-username">Username</h3>

      <div class="bio-section">
        <label for="bio-input">About Me (Bio):</label>
        <textarea 
          id="bio-input" 
          maxlength="150" 
          placeholder="Write something about yourself..."
        ></textarea>
        
        <div class="bio-footer">
          <span id="bio-char-count">150 characters left</span>
          <button id="save-bio-btn" class="btn btn-primary">
            Save Bio
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Avatar Selector Window Overlay -->
  <div id="avatar-selector-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-avatar-selector" class="close-btn">&times;</button>
      <h3>Select Profile Avatar</h3>
      <p class="sub-text">Choose an avatar image from the options below:</p>
      
      <div class="avatar-grid">
        <img 
          src="avatar1.png" 
          class="preset-avatar" 
          data-avatar="avatar1.png" 
          alt="Avatar Preset 1" 
        />
        <img 
          src="avatar2.png" 
          class="preset-avatar" 
          data-avatar="avatar2.png" 
          alt="Avatar Preset 2" 
        />
        <img 
          src="avatar3.png" 
          class="preset-avatar" 
          data-avatar="avatar3.png" 
          alt="Avatar Preset 3" 
        />
        <img 
          src="avatar4.png" 
          class="preset-avatar" 
          data-avatar="avatar4.png" 
          alt="Avatar Preset 4" 
        />
        <img 
          src="avatar5.png" 
          class="preset-avatar" 
          data-avatar="avatar5.png" 
          alt="Avatar Preset 5" 
        />
      </div>
    </div>
  </div>

  <!-- View Other User Profile Modal -->
  <div id="view-profile-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-view-profile" class="close-btn">&times;</button>
      
      <div class="profile-header-edit">
        <img 
          id="view-user-avatar" 
          src="avatar1.png" 
          class="large-avatar" 
          alt="User Profile Image" 
        />
      </div>

      <h2 id="view-user-name">Username</h2>
      <p id="view-user-bio" class="bio-display">No bio available.</p>
      
      <div class="profile-actions">
        <button id="add-friend-btn" class="btn btn-primary full-width">
          Add Friend
        </button>
      </div>
    </div>
  </div>

  <!-- Friends List & Requests Modal -->
  <div id="friends-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-friends-modal" class="close-btn">&times;</button>
      
      <div class="tab-headers">
        <button id="tab-friends-list" class="tab-btn active">
          Friends
        </button>
        <button id="tab-add-friend" class="tab-btn">
          Add Friend
        </button>
        <button id="tab-requests" class="tab-btn">
          Requests
        </button>
      </div>

      <!-- Friends List Tab -->
      <div id="section-friends-list" class="tab-section">
        <div id="friends-container" class="friends-list"></div>
      </div>

      <!-- Add Friend Tab -->
      <div id="section-add-friend" class="tab-section hidden">
        <div class="add-friend-box">
          <input 
            type="text" 
            id="friend-username-input" 
            placeholder="Enter friend's username..." 
          />
          <button id="send-friend-req-btn" class="btn btn-primary">
            Send Request
          </button>
        </div>
        <p id="friend-req-status" class="status-msg"></p>
      </div>

      <!-- Pending Requests Tab -->
      <div id="section-requests" class="tab-section hidden">
        <div id="incoming-requests-container" class="friends-list"></div>
      </div>
    </div>
  </div>

  <!-- Direct Messages Window Overlay -->
  <div id="dm-overlay" class="modal-overlay hidden">
    <div class="modal-card dm-card">
      <button id="close-dm-modal" class="close-btn">&times;</button>
      
      <h3 id="dm-target-username">Direct Message</h3>
      
      <div id="dm-messages-container" class="messages-list dm-messages-list"></div>
      
      <form id="dm-form" class="message-form">
        <input 
          type="text" 
          id="dm-input" 
          placeholder="Type a message..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" class="btn btn-primary">
          Send
        </button>
      </form>
    </div>
  </div>

  <!-- Account Ban Notification Modal -->
  <div id="ban-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Account Banned</h2>
      <p>Your account has been restricted from participating in the chat.</p>
      <button id="dismiss-ban-btn" class="btn btn-danger">
        Dismiss
      </button>
    </div>
  </div>

  <!-- Main JavaScript File -->
  <script type="module" src="app.js"></script>
</body>
</html>
