    <!-- Friends & Requests View Section -->
    <div id="friends-section" class="chat-view-section hidden" style="flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-color);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="font-size: 16px;">Friends & Direct Messages</h2>
            <button id="back-to-chat-btn" class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;">Back to Chat</button>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="add-friend-input" placeholder="Enter username to add..." style="flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main);" />
            <button id="send-friend-request-btn" class="btn btn-primary">Add Friend</button>
        </div>
        <p id="friend-action-msg" style="color: var(--success); font-size: 12px; margin-top: 6px;"></p>

        <div style="margin-top: 20px;">
            <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 8px;">Pending Requests</h3>
            <div id="pending-requests-container" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="color: var(--text-muted); font-size: 13px;">No pending requests.</p>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 8px;">My Friends (Click to Open DM)</h3>
            <div id="friends-list-container" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="color: var(--text-muted); font-size: 13px;">No friends added yet.</p>
            </div>
        </div>
    </div>
</main>

<!-- Auth Modal -->
<div id="auth-overlay" class="overlay hidden">
    <div class="modal">
        <div class="tab-header">
            <button id="tab-register" class="tab-btn active">Register</button>
            <button id="tab-login" class="tab-btn">Login</button>
        </div>
        <form id="register-form" class="auth-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="register-username" placeholder="e.g. yanabanaya" required />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="register-password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary full-width">Create Account</button>
        </form>
        <form id="login-form" class="auth-form hidden">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="e.g. yanabanaya" required />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary full-width">Sign In</button>
        </form>
        <p id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 10px;"></p>
        <button id="close-modal-btn" class="close-btn">&times;</button>
    </div>
</div>

<!-- Profile & Bio Modal -->
<div id="profile-overlay" class="overlay hidden">
    <div class="modal profile-modal">
        <h2>My Profile</h2>
        <div class="profile-edit-container" style="margin: 15px 0;">
            <div class="avatar-wrapper" id="open-avatar-selector" style="display: inline-block; cursor: pointer;">
                <img id="edit-modal-avatar" class="profile-circle large-avatar" src="avatar1.png" alt="Avatar" />
            </div>
            <p style="margin-top: 10px; font-weight: 600;"><span id="profile-display-username"></span></p>
        </div>
        <div class="bio-section" style="text-align: left;">
            <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">BIO:</label>
            <textarea id="bio-input" maxlength="150" placeholder="Tell everyone a little about yourself..."></textarea>
            <div id="bio-char-count" style="font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 4px;">150 characters left</div>
            <button id="save-bio-btn" class="btn btn-primary full-width mt-10">Save Bio & Changes</button>
        </div>
        <button id="close-profile-modal" class="close-btn">&times;</button>
    </div>
</div>

<!-- Avatar Selector Modal -->
<div id="avatar-selector-overlay" class="overlay hidden">
    <div class="modal">
        <h2>Choose Your Avatar</h2>
        <div class="avatar-grid">
            <img class="preset-avatar" src="avatar1.png" data-avatar="avatar1.png" alt="avatar1" />
            <img class="preset-avatar" src="avatar2.png" data-avatar="avatar2.png" alt="avatar2" />
            <img class="preset-avatar" src="avatar3.png" data-avatar="avatar3.png" alt="avatar3" />
            <img class="preset-avatar" src="avatar4.png" data-avatar="avatar4.png" alt="avatar4" />
            <img class="preset-avatar" src="avatar5.png" data-avatar="avatar5.png" alt="avatar5" />
        </div>
        <button id="close-avatar-selector" class="btn btn-secondary full-width mt-20">Back</button>
    </div>
</div>

<!-- View Other User Profile Modal -->
<div id="view-profile-overlay" class="overlay hidden">
    <div class="modal profile-modal">
        <div class="profile-edit-container" style="margin: 15px 0;">
            <img id="view-user-avatar" class="profile-circle large-avatar" src="avatar1.png" alt="Avatar" />
            <h2 id="view-user-name" style="margin-top: 10px;">Username</h2>
        </div>
        <div class="bio-display-section" style="text-align: left; margin: 15px 0;">
            <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">BIO:</label>
            <div id="view-user-bio" style="padding: 10px; background: var(--bg-color); border-radius: var(--radius-sm); margin-top: 5px; min-height: 50px; font-size: 13px;">No bio available.</div>
        </div>
        <button id="profile-friend-action-btn" class="btn btn-primary full-width mb-10">Send Friend Request</button>
        <button id="close-view-profile" class="btn btn-secondary full-width">Close</button>
    </div>
</div>

<script>
    const starsContainer = document.getElementById("stars-container");
    for (let i = 0; i < 30; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = `${Math.random() * 100}vw`;
        star.style.top = `${Math.random() * -100}vh`;
        star.style.width = `${2 + Math.random() * 2}px`;
        star.style.height = star.style.width;
        star.style.animationDuration = `${6 + Math.random() * 4}s`;
        star.style.animationDelay = `${Math.random() * 5}s`;
        starsContainer.appendChild(star);
    }
    const music = document.getElementById("bg-music");
    const musicBtn = document.getElementById("music-toggle-btn");
    let isPlaying = false;
    musicBtn.addEventListener("click", () => {
        if (isPlaying) { music.pause(); musicBtn.style.opacity = "0.5"; isPlaying = false; }
        else { music.play().then(() => { musicBtn.style.opacity = "1"; isPlaying = true; }).catch(() => {}); }
    });
</script>
<script type="module" src="app.js"></script>
</body>
</html>
