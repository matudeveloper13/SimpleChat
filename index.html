<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Left User Profile Snippet -->
  <div id="top-left-profile" class="top-left-profile hidden">
    <img id="my-mini-avatar" src="avatar1.png" alt="Avatar" class="profile-circle">
    <span id="my-mini-username">Username</span>
  </div>

  <div class="chat-container">
    <header class="chat-header">
      <div class="header-title">
        <h1>SimpleChat</h1>
      </div>
      <div class="header-actions">
        <span id="current-user-text" class="current-user">Guest</span>
        <button id="auth-modal-btn" class="btn-primary">Sign In / Register</button>
        <button id="logout-btn" class="btn-secondary hidden">Sign Out</button>
      </div>
    </header>

    <div id="messages-container" class="messages-container">
      <div class="empty-state">Loading messages...</div>
    </div>

    <div id="typing-indicator" class="typing-indicator hidden">
      <span id="typing-text">Someone is typing...</span>
    </div>

    <form id="message-form" class="message-form">
      <button type="button" id="emoji-btn" class="emoji-btn" disabled>😀</button>
      <input type="text" id="message-input" placeholder="Sign in to chat..." autocomplete="off" disabled>
      <button type="submit" id="send-btn" class="send-btn" disabled>Send</button>
    </form>
  </div>

  <!-- Auth Modal -->
  <div id="auth-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="close-modal-btn" class="close-modal">&times;</button>
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active">Sign In</button>
        <button id="tab-register" class="tab-btn">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <h2>Welcome Back</h2>
        <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <h2>Create Account</h2>
        <input type="text" id="register-username" placeholder="Choose a Username" required autocomplete="username">
        <input type="password" id="register-password" placeholder="Choose a Password" required autocomplete="new-password">
        <button type="submit" class="btn-submit">Register</button>
      </form>

      <div id="auth-error" class="auth-error"></div>
    </div>
  </div>

  <!-- Profile & Bio Modal -->
  <div id="profile-overlay" class="modal-overlay hidden">
    <div class="modal profile-modal">
      <button id="close-profile-modal" class="close-modal">&times;</button>
      <h2>My Profile</h2>
      <div class="profile-edit-container">
        <div class="avatar-container-clickable" id="open-avatar-selector" title="Click to change avatar">
          <img id="edit-modal-avatar" src="avatar1.png" alt="My Avatar" class="profile-circle large-avatar">
          <div class="avatar-edit-overlay">Change</div>
        </div>
        <p class="fixed-username-label">Username: <span id="profile-display-username"></span></p>
      </div>
      
      <div class="bio-section">
        <label for="bio-input">Bio (max 150 characters):</label>
        <textarea id="bio-input" maxlength="150" placeholder="Tell everyone a little about yourself..."></textarea>
        <span id="bio-char-count">150 characters left</span>
        <button id="save-bio-btn" class="btn-submit">Save Bio</button>
      </div>
    </div>
  </div>

  <!-- Avatar Selector Modal -->
  <div id="avatar-selector-overlay" class="modal-overlay hidden">
    <div class="modal avatar-selector-modal">
      <button id="close-avatar-selector" class="close-modal">&times;</button>
      <h2>Choose an Avatar</h2>
      <div class="avatar-grid">
        <img src="avatar1.png" class="preset-avatar profile-circle" data-avatar="avatar1.png">
        <img src="avatar2.png" class="preset-avatar profile-circle" data-avatar="avatar2.png">
        <img src="avatar3.png" class="preset-avatar profile-circle" data-avatar="avatar3.png">
        <img src="avatar4.png" class="preset-avatar profile-circle" data-avatar="avatar4.png">
        <img src="avatar5.png" class="preset-avatar profile-circle" data-avatar="avatar5.png">
      </div>
    </div>
  </div>

  <!-- View Other User Profile Modal -->
  <div id="view-profile-overlay" class="modal-overlay hidden">
    <div class="modal profile-modal">
      <button id="close-view-profile" class="close-modal">&times;</button>
      <div class="profile-edit-container">
        <img id="view-user-avatar" src="avatar1.png" alt="User Avatar" class="profile-circle large-avatar">
        <h2 id="view-user-name" style="margin-top: 10px;">Username</h2>
      </div>
      <div class="bio-display-section">
        <p><strong>Bio:</strong></p>
        <p id="view-user-bio" class="bio-text-box">No bio available.</p>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
