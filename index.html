<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleChat</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-container">
    
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="status-indicator">
          <span class="pulse"></span>
        </div>
        <h1>SimpleChat</h1>
      </div>
      <div id="user-status" class="user-status">
        <span id="current-user-text">Guest</span>
        <button id="auth-modal-btn" class="btn btn-outline">Sign In</button>
        <button id="logout-btn" class="btn btn-outline hidden">Log Out</button>
      </div>
    </header>

    <!-- Message Feed -->
    <div id="messages-container" class="messages-box">
      <div class="empty-state">Loading messages...</div>
    </div>

    <!-- Typing Indicator Area -->
    <div id="typing-indicator" class="typing-wrapper hidden">
      <div class="typing-bubble">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <span id="typing-text">Someone is typing...</span>
    </div>

    <!-- Input Area with Emoji Button -->
    <div class="input-section">
      <form id="message-form" class="message-form">
        <button type="button" id="emoji-btn" class="btn-emoji" title="Open Emoji Keyboard (Win + . or Cmd + Ctrl + Space)" disabled>😀</button>
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Sign in to start typing..." disabled required autocomplete="off" />
        </div>
        <button type="submit" id="send-btn" class="btn btn-primary" disabled>
          Send
        </button>
      </form>
    </div>

  </main>

  <!-- Auth Modal -->
  <div id="auth-overlay" class="overlay hidden">
    <div class="modal">
      <div class="tab-header">
        <button id="tab-register" class="tab-btn active">Register</button>
        <button id="tab-login" class="tab-btn">Login</button>
      </div>

      <!-- Register -->
      <form id="register-form" class="auth-form">
        <div class="input-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" placeholder="e.g. Alex" required />
        </div>
        <div class="input-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>

      <!-- Login -->
      <form id="login-form" class="auth-form hidden">
        <div class="input-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="e.g. Alex" required />
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign In</button>
      </form>

      <p id="auth-error" class="error-msg"></p>
      <button id="close-modal-btn" class="btn-text">Cancel</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
