<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./icon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="./icon.png?v=2" />
  <link rel="manifest" href="manifest.json" />
  <title>SimpleChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Falling Background Stars Container -->
  <div class="stars-container" id="stars-container"></div>

  <!-- Background Music (Loop enabled) -->
  <audio id="bg-music" loop>
    <source src="relaxing.mp3" type="audio/mpeg">
  </audio>

  <!-- Absolute Upper-Left Website Corner Discord Logo -->
  <a href="https://discord.gg/nNGp9VVGWs" target="_blank" class="absolute-discord-logo" title="Join Discord">
    <img src="discord.png" alt="Discord" />
  </a>

  <!-- Music Mute/Unmute Button in Upper Right -->
  <button id="music-toggle-btn" class="absolute-music-btn" title="Play/Pause Music">🎵</button>

  <main class="chat-container">
    
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div id="top-left-profile" class="top-left-profile hidden" title="Click to view/edit profile & bio">
          <img id="my-mini-avatar" src="avatar1.png" alt="Avatar" class="profile-circle" />
          <span id="my-mini-username">Username</span>
        </div>
        <div class="brand-title-group">
          <h1>SimpleChat</h1>
        </div>
      </div>
      <div id="user-status" class="user-status">
        <span id="current-user-text">matubanana2</span>
        <!-- Settings Gear Button next to the username -->
        <button id="settings-gear-btn" class="settings-gear-btn" title="Settings">⚙️</button>
        <button id="auth-modal-btn" class="btn btn-outline hidden">Sign In</button>
        <button id="logout-btn" class="btn btn-outline">Log Out</button>
      </div>
    </header>

    <!-- Message Feed -->
    <div id="messages-container" class="messages-box">
      <div class="empty-state">Loading messages...</div>
    </div>

    <!-- Active Reply Preview Box Above Input -->
    <div id="reply-preview-container" class="reply-preview-container hidden">
      <div class="reply-preview-content">
        <span id="reply-preview-text">Replying to someone...</span>
        <button id="cancel-reply-btn" class="cancel-reply-x">&times;</button>
      </div>
    </div>

    <!-- Typing Indicator Area -->
    <div id="typing-indicator" class="typing-wrapper hidden">
      <div class="typing-bubble">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <span id="typing-text">Someone is typing...</span>
    </div>

    <!-- Input Area with Emoji Button -->
    <div class="input-section">
      <form id="message-form" class="message-form">
        <button type="button" id="emoji-btn" class="btn-emoji" title="Open Emoji Keyboard" disabled>😀</button>
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Message..." disabled required autocomplete="off" />
        </div>
        <button type="submit" id="send-btn" class="btn btn-primary" disabled>
          Send
        </button>
      </form>
    </div>

  </main>

  <!-- Auth Modal -->
  <div id="auth-overlay" class="overlay hidden">
    <div class="modal">
      <div class="tab-header">
        <button id="tab-register" class="tab-btn active">Register</button>
        <button id="tab-login" class="tab-btn">Login</button>
      </div>

      <!-- Register -->
      <form id="register-form" class="auth-form">
        <div class="input-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" placeholder="e.g. Alex" required />
        </div>
        <div class="input-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>

      <!-- Login -->
      <form id="login-form" class="auth-form hidden">
        <div class="input-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="e.g. Alex" required />
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign In</button>
      </form>

      <p id="auth-error" class="error-msg"></p>
      <button id="close-modal-btn" class="btn-text">Cancel</button>
    </div>
  </div>

  <!-- Settings Modal (Dark/Light Mode UI like Profile UI) -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="modal settings-modal">
      <h2>Settings</h2>
      <div class="settings-options-container" style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px; text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 600; font-size: 14px;">Theme Mode</span>
          <div style="display: flex; gap: 8px;">
            <button id="light-mode-btn" class="btn btn-outline" style="padding: 6px 12px; font-size: 13px;">Light Mode</button>
            <button id="dark-mode-btn" class="btn btn-primary" style="padding: 6px 12px; font-size: 13px;">Dark Mode</button>
          </div>
        </div>
      </div>
      <button id="close-settings-modal" class="btn btn-primary full-width">Done</button>
    </div>
  </div>

  <!-- Profile & Bio Modal -->
  <div id="profile-overlay" class="overlay hidden">
    <div class="modal profile-modal">
      <h2>My Profile</h2>
      <div class="profile-edit-container">
        <div class="avatar-container-clickable" id="open-avatar-selector" title="Click to change avatar">
          <img id="edit-modal-avatar" src="avatar1.png" alt="My Avatar" class="profile-circle large-avatar" />
          <div class="avatar-edit-overlay">Change</div>
        </div>
        <p class="fixed-username-label">Username: <span id="profile-display-username"></span></p>
      </div>
      
      <div class="bio-section">
        <label for="bio-input">Bio (max 150 characters):</label>
        <textarea id="bio-input" maxlength="150" placeholder="Tell everyone a little about yourself..."></textarea>
        <span id="bio-char-count">150 characters left</span>
        <button id="save-bio-btn" class="btn btn-primary full-width">Save Bio</button>
      </div>
      <button id="close-profile-modal" class="btn-text">Close</button>
    </div>
  </div>

  <!-- Avatar Selector Modal -->
  <div id="avatar-selector-overlay" class="overlay hidden">
    <div class="modal avatar-selector-modal">
      <h2>Choose an Avatar</h2>
      <div class="avatar-grid">
        <img src="avatar1.png" class="preset-avatar profile-circle" data-avatar="avatar1.png" />
        <img src="avatar2.png" class="preset-avatar profile-circle" data-avatar="avatar2.png" />
        <img src="avatar3.png" class="preset-avatar profile-circle" data-avatar="avatar3.png" />
        <img src="avatar4.png" class="preset-avatar profile-circle" data-avatar="avatar4.png" />
        <img src="avatar5.png" class="preset-avatar profile-circle" data-avatar="avatar5.png" />
      </div>
      <button id="close-avatar-selector" class="btn-text" style="margin-top:20px;">Back</button>
    </div>
  </div>

  <!-- View Other User Profile Modal -->
  <div id="view-profile-overlay" class="overlay hidden">
    <div class="modal profile-modal">
      <div class="profile-edit-container">
        <img id="view-user-avatar" src="avatar1.png" alt="User Avatar" class="profile-circle large-avatar" />
        <h2 id="view-user-name" style="margin-top: 10px;">Username</h2>
      </div>
      <div class="bio-display-section" style="text-align: left; margin-bottom: 20px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Bio:</label>
        <div id="view-user-bio" class="bio-text-box">No bio available.</div>
      </div>
      <button id="close-view-profile" class="btn btn-primary full-width">Close</button>
    </div>
  </div>

  <!-- Script logic for background stars, settings modal, and music toggle -->
  <script>
    const starsContainer = document.getElementById("stars-container");
    for (let i = 0; i < 50; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * -100}vh`;
      star.style.width = `${2 + Math.random() * 3}px`;
      star.style.height = star.style.width;
      star.style.animationDuration = `${6 + Math.random() * 6}s`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starsContainer.appendChild(star);
    }

    const music = document.getElementById("bg-music");
    const musicBtn = document.getElementById("music-toggle-btn");
    let isPlaying = false;
    musicBtn.addEventListener("click", () => {
      if (isPlaying) {
        music.pause();
        musicBtn.style.opacity = "0.4";
        isPlaying = false;
      } else {
        music.play().then(() => {
          musicBtn.style.opacity = "1";
          isPlaying = true;
        }).catch(err => console.log("Audio play prevented:", err));
      }
    });

    const settingsBtn = document.getElementById("settings-gear-btn");
    const settingsOverlay = document.getElementById("settings-overlay");
    const closeSettingsBtn = document.getElementById("close-settings-modal");
    const lightModeBtn = document.getElementById("light-mode-btn");
    const darkModeBtn = document.getElementById("dark-mode-btn");

    settingsBtn.addEventListener("click", () => {
      settingsOverlay.classList.remove("hidden");
    });

    closeSettingsBtn.addEventListener("click", () => {
      settingsOverlay.classList.add("hidden");
    });

    lightModeBtn.addEventListener("click", () => {
      document.body.classList.remove("dark-mode");
      lightModeBtn.className = "btn btn-primary";
      darkModeBtn.className = "btn btn-outline";
    });

    darkModeBtn.addEventListener("click", () => {
      document.body.classList.add("dark-mode");
      darkModeBtn.className = "btn btn-primary";
      lightModeBtn.className = "btn btn-outline";
    });
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
