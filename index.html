<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- This puts icon.png right next to the page name in the browser tab -->
  <link rel="icon" type="image/png" href="icon.png" />
  <title>SimpleChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-container">
    
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div id="top-left-profile" class="top-left-profile hidden" title="Click to view/edit profile & bio">
          <img id="my-mini-avatar" src="avatar1.png" alt="Avatar" class="profile-circle" />
          <span id="my-mini-username">Username</span>
        </div>
        <div class="brand-title-group">
          <h1>SimpleChat</h1>
        </div>
      </div>
      <div id="user-status" class="user-status">
        <span id="current-user-text">Guest</span>
        <button id="auth-modal-btn" class="btn btn-outline">Sign In</button>
        <button id="logout-btn" class="btn btn-outline hidden">Log Out</button>
      </div>
    </header>

    <!-- Message Feed -->
    <div id="messages-container" class="messages-box">
      <div class="empty-state">Loading messages...</div>
    </div>

    <!-- Typing Indicator Area -->
    <div id="typing-indicator" class="typing-wrapper hidden">
      <div class="typing-bubble">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <span id="typing-text">Someone is typing...</span>
    </div>

    <!-- Input Area with Emoji Button -->
    <div class="input-section">
      <form id="message-form" class="message-form">
        <button type="button" id="emoji-btn" class="btn-emoji" title="Open Emoji Keyboard" disabled>😀</button>
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Sign in to start typing..." disabled required autocomplete="off" />
        </div>
        <button type="submit" id="send-btn" class="btn btn-primary" disabled>
          Send
        </button>
      </form>
    </div>

  </main>

  <!-- Auth Modal -->
  <div id="auth-overlay" class="overlay hidden">
    <div class="modal">
      <div class="tab-header">
        <button id="tab-register" class="tab-btn active">Register</button>
        <button id="tab-login" class="tab-btn">Login</button>
      </div>

      <!-- Register -->
      <form id="register-form" class="auth-form">
        <div class="input-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" placeholder="e.g. Alex" required />
        </div>
        <div class="input-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>

      <!-- Login -->
      <form id="login-form" class="auth-form hidden">
        <div class="input-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="e.g. Alex" required />
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign In</button>
      </form>

      <p id="auth-error" class="error-msg"></p>
      <button id="close-modal-btn" class="btn-text">Cancel</button>
    </div>
  </div>

  <!-- Profile & Bio Modal -->
  <div id="profile-overlay" class="overlay hidden">
    <div class="modal profile-modal">
      <h2>My Profile</h2>
      <div class="profile-edit-container">
        <div class="avatar-container-clickable" id="open-avatar-selector" title="Click to change avatar">
          <img id="edit-modal-avatar" src="avatar1.png" alt="My Avatar" class="profile-circle large-avatar" />
          <div class="avatar-edit-overlay">Change</div>
        </div>
        <p class="fixed-username-label">Username: <span id="profile-display-username"></span></p>
      </div>
      
      <div class="bio-section">
        <label for="bio-input">Bio (max 150 characters):</label>
        <textarea id="bio-input" maxlength="150" placeholder="Tell everyone a little about yourself..."></textarea>
        <span id="bio-char-count">150 characters left</span>
        <button id="save-bio-btn" class="btn btn-primary full-width">Save Bio</button>
      </div>
      <button id="close-profile-modal" class="btn-text">Close</button>
    </div>
  </div>

  <!-- Avatar Selector Modal -->
  <div id="avatar-selector-overlay" class="overlay hidden">
    <div class="modal avatar-selector-modal">
      <h2>Choose an Avatar</h2>
      <div class="avatar-grid">
        <img src="avatar1.png" class="preset-avatar profile-circle" data-avatar="avatar1.png" />
        <img src="avatar2.png" class="preset-avatar profile-circle" data-avatar="avatar2.png" />
        <img src="avatar3.png" class="preset-avatar profile-circle" data-avatar="avatar3.png" />
        <img src="avatar4.png" class="preset-avatar profile-circle" data-avatar="avatar4.png" />
        <img src="avatar5.png" class="preset-avatar profile-circle" data-avatar="avatar5.png" />
      </div>
      <button id="close-avatar-selector" class="btn-text" style="margin-top:20px;">Back</button>
    </div>
  </div>

  <!-- View Other User Profile Modal -->
  <div id="view-profile-overlay" class="overlay hidden">
    <div class="modal profile-modal">
      <div class="profile-edit-container">
        <img id="view-user-avatar" src="avatar1.png" alt="User Avatar" class="profile-circle large-avatar" />
        <h2 id="view-user-name" style="margin-top: 10px;">Username</h2>
      </div>
      <div class="bio-display-section" style="text-align: left; margin-bottom: 20px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Bio:</label>
        <div id="view-user-bio" class="bio-text-box">No bio available.</div>
      </div>
      <button id="close-view-profile" class="btn btn-primary full-width">Close</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
